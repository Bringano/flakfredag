services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beerapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/beerapp
      PORT: 3000
      ASPNETCORE_ENVIRONMENT: Production
      # Delat lösenordsskydd (HTTP Basic Auth). Ändra gärna lokalt om du vill
      # testa inloggningsrutan — på Render sätts riktiga värden i dashboarden.
      APP_USERNAME: flakfredag
      APP_PASSWORD: olprovning
    ports:
      - "3000:3000"

volumes:
  pgdata:
