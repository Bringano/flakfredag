databases:
  - name: olprovning-db
    plan: free
    databaseName: beerapp
    user: beerapp

services:
  - type: web
    name: olprovning
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: olprovning-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
    healthCheckPath: /api/health
