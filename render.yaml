services:
  - type: web
    name: olprovning
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      # Databasen ligger på Neon (Renders gratis-Postgres raderas efter 30 dagar).
      # Connection string fylls i manuellt i Render-dashboarden.
      - key: DATABASE_URL
        sync: false
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Fylls i manuellt i Render-dashboarden (sync: false = sparas aldrig i git).
      # APP_USERNAME MÅSTE vara exakt "flakfredag" (hårdkodat i client/src/auth.ts).
      # APP_PASSWORD är det faktiska lösenordet ni delar med varandra.
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
    healthCheckPath: /api/health
